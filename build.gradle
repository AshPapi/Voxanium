plugins {
    id 'java-library'
    id 'idea'
    id 'eclipse'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

version = "${mod_version}"
group = "${mod_group_id}"

base {
    archivesName = "voxanium-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "NeoForged"
        url = "https://maven.neoforged.net/releases"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name "caffeinemcRepository"
                url "https://maven.caffeinemc.net/snapshots"
            }
        }
        filter {
            includeGroup "net.caffeinemc"
        }
    }
    maven { url = "https://maven.shedaniel.me/" }
}

neoForge {
    version = project.neo_version

    accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg'))

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            var graphicsApi = project.findProperty('graphicsBackend') ?: 'VULKAN'
            programArguments.addAll '--username', 'Dev', '--graphicsBackend', graphicsApi.toString()
            if (project.hasProperty('vulkanValidation') || Boolean.getBoolean('vulkanValidation')) {
                programArguments.add '--vulkanValidation'
            }
        }
    }
}

configurations {
    natives {
        transitive = false
    }
}

dependencies {
    // Sodium (classes extracted for compilation) & Iris
    compileOnly files('libs/sodium-neoforge-26.3.jar')
    runtimeOnly "maven.modrinth:sodium:${project.sodium_version}"
    compileOnly "maven.modrinth:iris:${project.iris_version}"
    // runtimeOnly "maven.modrinth:iris:${project.iris_version}"
    compileOnly "maven.modrinth:vivecraft:26.3-1.3.17-neoforge"
    compileOnly "maven.modrinth:chunky:EyCqftOK" // Chunky-NeoForge 1.5.4
    compileOnly "maven.modrinth:lithium:mc26.3-0.26.2-neoforge"
    compileOnly "maven.modrinth:vitrail-shaders:Q3nKuPKJ"

    // GLSL transformer for shader patch AST
    compileOnly 'io.github.douira:glsl-transformer:2.0.1'

    // Core storage / native libraries
    jarJar(implementation('org.rocksdb:rocksdbjni:10.2.1'))
    jarJar(implementation('redis.clients:jedis:5.1.0'))
    jarJar(implementation('org.apache.commons:commons-pool2:2.12.0'))
    jarJar(implementation('org.lz4:lz4-java:1.8.0'))
    jarJar(implementation('org.tukaani:xz:1.10'))
    jarJar(implementation('org.xerial:sqlite-jdbc:3.49.1.0'))

    // LWJGL extra bindings (LWJGL 3.4.3 matching Minecraft 26.3)
    jarJar(implementation('org.lwjgl:lwjgl-lmdb:3.4.3'))
    jarJar(implementation('org.lwjgl:lwjgl-zstd:3.4.3'))
    natives 'org.lwjgl:lwjgl-lmdb:3.4.3:natives-windows'
    natives 'org.lwjgl:lwjgl-zstd:3.4.3:natives-windows'
}

def windowsOnlyJars = ['org.rocksdb:rocksdbjni', 'org.xerial:sqlite-jdbc', 'org.lz4:lz4-java']
def windowsNatives = ['win64', 'Windows/x86_64/', 'win32/amd64/']

def windowsOnlyTasks = windowsOnlyJars.collect { module ->
    def (artifactGroup, artifactName) = module.split(':')
    tasks.register("makeWindowsOnly" + artifactName.split('-').collect { it.capitalize() }.join(''), Zip) {
        archiveExtension.set("jar")
        entryCompression = ZipEntryCompression.STORED
        destinationDirectory.set temporaryDir

        dependsOn configurations.runtimeClasspath

        def files = configurations.runtimeClasspath.incoming.artifactView {
            componentFilter { id ->
                id instanceof ModuleComponentIdentifier && id.group == artifactGroup && id.module == artifactName
            }
        }.files

        from {->zipTree(files.singleFile)}
        archiveFileName.set(providers.provider{files.singleFile.name})

        exclude {
            def file = it.relativePath.pathString
            if (![".so", ".dll", ".dylib", ".jnilib"].any(file::endsWith)) {
                return false
            }
            return !windowsNatives.any(file::contains)
        }
    }
}

tasks.named('jarJar').configure {
    def windowsOnlyFiles = windowsOnlyTasks.collect { task -> task.flatMap { it.archiveFile } }
    windowsOnlyFiles.each { inputs.file(it) }
    doLast {
        windowsOnlyFiles.each { file ->
            def src = file.get().asFile
            def dst = outputDirectory.file("META-INF/jarjar/${src.name}").get().asFile
            if (!dst.exists()) {
                throw new GradleException("jarJar has no ${src.name}")
            }
            java.nio.file.Files.copy(src.toPath(), dst.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.natives.collect { zipTree(it) }
    } {
        include '**/*.dll', '**/*.so', '**/*.dylib'
        exclude 'META-INF/**'
        exclude '**/*.class'
    }
}

tasks.named('processResources', ProcessResources).configure {
    var props = [
            minecraft_version: project.minecraft_version,
            neo_version      : project.neo_version,
            mod_id           : project.mod_id,
            mod_name         : project.mod_name,
            mod_version      : project.mod_version,
            mod_authors      : project.mod_authors
    ]
    inputs.properties props

    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}
